name: katuya_repartidor
description: Katuya Driver App — Send it fast (by Silvio Lionel Nieva)
publish_to: none

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # Katuya shared packages
  shared_models:
    path: ../../packages/shared_models
  shared_theme:
    path: ../../packages/shared_theme
  shared_utils:
    path: ../../packages/shared_utils

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.10
  firebase_crashlytics: ^3.4.9
  firebase_performance: ^0.9.3+7

  # State Management
  flutter_riverpod: ^2.4.9
  
  # Navigation
  go_router: ^13.0.1

  # Maps & Location
  google_maps_flutter: ^2.5.3
  google_maps_flutter_web: ^0.5.4+2
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Background location
  flutter_foreground_task: ^6.1.2

  # Utils
  intl: ^0.19.0
  http: ^1.1.2
  url_launcher: ^6.2.2
  flutter_ringtone_player: ^4.0.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/logo/
    - assets/sounds/
