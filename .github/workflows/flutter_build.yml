name: Flutter Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  FLUTTER_VERSION: '3.19.x'
  JAVA_VERSION: '17'

jobs:
  build-commerce-apk:
    name: Build Merchant APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/commerce_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: |
          flutter pub get
          for pkg in ../../packages/*; do (cd "$pkg" && flutter pub get); done

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build APK (prod)
        run: flutter build apk --release --flavor prod --target lib/main_prod.dart
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: commerce-app-apk
          path: apps/commerce_app/build/app/outputs/flutter-apk/*-prod-release.apk

  build-driver-apk:
    name: Build Driver APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/driver_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: |
          flutter pub get
          for pkg in ../../packages/*; do (cd "$pkg" && flutter pub get); done

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build APK (prod)
        run: flutter build apk --release --flavor prod --target lib/main_prod.dart
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: driver-app-apk
          path: apps/driver_app/build/app/outputs/flutter-apk/*-prod-release.apk

  release:
    name: Create GitHub Release
    needs: [build-commerce-apk, build-driver-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*.apk
          generate_release_notes: true
          body: |
            ## Katuya Release ${{ github.ref_name }}

            **by Silvio Lionel Nieva**

            ### Apps
            - Katuya Comercio (Merchant) — Android APK
            - Katuya Repartidor (Driver) — Android APK

            ### Web Builds
            Deployed automatically to Firebase Hosting via `firebase_deploy` workflow.

            ### Checksums
            See release artifacts for SHA-256 checksums.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
