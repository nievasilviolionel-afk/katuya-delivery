name: PR Checks

on:
  pull_request:
    branches: [main, develop]

env:
  FLUTTER_VERSION: '3.19.x'
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/functions/coverage/

  flutter-analyze-commerce:
    name: Flutter Analyze — Merchant
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/commerce_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: |
          flutter pub get
          for pkg in ../../packages/*; do (cd "$pkg" && flutter pub get); done
      - run: flutter analyze --fatal-infos
      - run: flutter test

  flutter-analyze-driver:
    name: Flutter Analyze — Driver
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/driver_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: |
          flutter pub get
          for pkg in ../../packages/*; do (cd "$pkg" && flutter pub get); done
      - run: flutter analyze --fatal-infos
      - run: flutter test

  admin-build:
    name: Admin Panel Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin_panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/admin_panel/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test:ci
      - uses: actions/upload-artifact@v4
        with:
          name: admin-coverage
          path: apps/admin_panel/coverage/
